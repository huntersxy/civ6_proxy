name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Run tests
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p release/stage-win release/stage-linux

          echo "==> Building Windows client (windows/amd64)"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o release/Civ6RelayClient.exe ./cmd/client

          echo "==> Building Linux server & tunnelcheck (linux/amd64)"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o release/stage-linux/civ6relay-server ./cmd/server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags "-s -w" \
            -o release/stage-linux/civ6relay-tunnelcheck ./cmd/tunnelcheck

          echo "==> Packaging archives"
          cp release/Civ6RelayClient.exe THIRD_PARTY_NOTICES.md README.md release/stage-win/
          (cd release/stage-win && zip -q "../Civ6RelayClient-${TAG}-windows-amd64.zip" Civ6RelayClient.exe THIRD_PARTY_NOTICES.md README.md)

          cp -r deploy THIRD_PARTY_NOTICES.md README.md release/stage-linux/
          tar -czf "release/civ6relay-server-${TAG}-linux-amd64.tar.gz" -C release/stage-linux .

          rm -rf release/stage-win release/stage-linux

          echo "==> Generating SHA256SUMS.txt"
          (cd release && sha256sum \
            Civ6RelayClient.exe \
            "Civ6RelayClient-${TAG}-windows-amd64.zip" \
            "civ6relay-server-${TAG}-linux-amd64.tar.gz" \
            > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            release/Civ6RelayClient.exe \
            "release/Civ6RelayClient-${TAG}-windows-amd64.zip" \
            "release/civ6relay-server-${TAG}-linux-amd64.tar.gz" \
            release/SHA256SUMS.txt \
            --title "${TAG}" \
            --generate-notes
