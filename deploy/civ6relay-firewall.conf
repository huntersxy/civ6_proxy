# Installed as /etc/systemd/system/civ6relay.service.d/firewall.conf.
#
# 1Panel (or a plain host firewall) drops inbound UDP by default. Docker
# published ports bypass that filter, but a native systemd service does not,
# so make sure UDP 42056 is accepted before the relay starts.
[Unit]
After=1panel-core.service 1panel-agent.service

[Service]
ExecStartPre=+/bin/sh -c 'iptables -C INPUT -p udp --dport 42056 -m comment --comment civ6relay -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p udp --dport 42056 -m comment --comment civ6relay -j ACCEPT'
