services:
  civ6relay:
    build: .
    image: civ6relay-server:latest
    restart: unless-stopped
    # host 网络：NIC 速度可被自动探测，UDP 转发零开销；端口映射在此模式下无效
    network_mode: host
    # 可选环境变量（全部有默认值，按需追加到下方 environment）：
    #   CIV6_TOTAL_MBPS      总上传 Mbps；不填则自动探测 NIC，失败回退 100
    #   CIV6_MAX_MEMBERS     预期峰值并发成员数（默认 100）；带宽按此值均分
    #   CIV6_MAX_ROOMS       最大并发房间数（默认 1024）
    #   CIV6_PORT            监听 UDP 端口（默认 42056）
    #   CIV6_SPEEDTEST_MBPS  测速上限 Mbps（默认 0 = 关闭）
    #   CIV6_QUIET           1 = 关闭房间生命周期日志
    #   CIV6_READERS         UDP 读取协程数（默认 0 = 服务端默认值 1）
    environment:
      CIV6_MAX_MEMBERS: "100"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
